# Example Docker Compose fragment for Tilawah.
#
# The real deploy uses ONE shared Compose project on the server (at /opt/bots)
# that runs several bots against a single shared MariaDB container (`shared-db`).
# This file is NOT that whole project; it documents just the two services
# Tilawah adds, so you can copy them under `services:` in
# /opt/bots/docker-compose.yml, alongside the existing `shared-db`. It follows
# the server's own template (compose-with-db.yml).
#
# The bot keeps each reader's place in the Quran in the shared database, so its
# .env must point DATABASE_URL at the DB service NAME as host (not localhost):
#
#   DATABASE_URL="mysql://<user>:<password>@shared-db:3306/tilawah"
#
# Secrets live in an env file on the server, never committed:
#
#   /opt/bots/telegram/tilawah/.env   (BOT_TOKEN, DATABASE_URL, CHANNEL_CHAT_ID,
#                                      ADMIN_TELEGRAM_IDS, USER_WIRD_ENABLED, ...)
#
# Build context and env_file paths are relative to /opt/bots, where the deploy
# workflow checks the repo out (/opt/bots/telegram/tilawah). The deploy runs,
# from /opt/bots:
#
#   docker compose run --rm --build tilawah-migrate   # apply migrations + seed, then exit
#   docker compose up -d --build tilawah              # (re)start the long-running bot

services:
  # One-off helper: apply pending migrations and seed the Quran data, then exit.
  # `profiles: ["migrate"]` keeps it OUT of a normal `docker compose up`, so it
  # runs only when called by name. Both steps are idempotent (db:deploy applies
  # only pending migrations; the seed stops if the text is already loaded), so
  # running it on every deploy is safe. The bot's single-stage image keeps the
  # Prisma CLI, so this reuses the same build.
  tilawah-migrate:
    build: ./telegram/tilawah
    env_file: ./telegram/tilawah/.env
    depends_on:
      shared-db:
        condition: service_healthy
    command: sh -c "pnpm db:deploy && pnpm db:seed"
    restart: 'no'
    profiles: ['migrate']

  # The long-running bot. The image defines a HEALTHCHECK against /health, so
  # `docker ps` and the orchestrator can tell a wedged bot from a healthy one.
  tilawah:
    build: ./telegram/tilawah
    env_file: ./telegram/tilawah/.env
    restart: unless-stopped
    depends_on:
      shared-db:
        condition: service_healthy
    # Self-hosted Mushaf images (optional; only when MUSHAF_IMAGE_BASE_URL is a
    # LOCAL path like "/app/assets/mushaf/{page3}.jpg"). The recommended way is a
    # BIND MOUNT of a host folder you fill yourself, kept in the server's shared
    # data tree OUTSIDE this code checkout, so a git pull/reset can never touch
    # it: /opt/bots/data/tilawah/mushaf. On your laptop run `pnpm data:mushaf`
    # (download + verify), eyeball a few pages, then upload the exact files:
    #   rsync -av assets/mushaf/ root@<server>:/opt/bots/data/tilawah/mushaf/
    # The bot mounts that folder READ-ONLY and uploads each page to Telegram once
    # (then sends by cached file_id), so the server never fetches from anyone.
    # Leave this line out if you serve images by URL or use text. (Alternative:
    # have the SERVER download them, see docs/DEPLOY.md, "Self-hosting the page
    # images".) The source is relative to /opt/bots, where the compose file lives.
    volumes:
      - ./data/tilawah/mushaf:/app/assets/mushaf:ro
      # Self-hosted page recitation audio (optional; only when
      # PAGE_AUDIO_BASE_URL is a LOCAL path like
      # "/app/assets/page-audio/{folder}/Page{page3}.mp3"). Same idea as the
      # Mushaf mount: build the verified set once into the shared data tree
      # OUTSIDE this checkout (see DEVELOPMENT.md, "Building the page recitation
      # audio"), mount it READ-ONLY here, recreate the bot (up -d, not restart),
      # then clear the page_audio file_id cache so the new clips are sent. Leave
      # this line out to stream from everyayah instead.
      - ./data/tilawah/page-audio:/app/assets/page-audio:ro
